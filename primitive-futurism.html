<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twinthos — Primitive Futurism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #090B0E;
    color: #E8E6E1;
    font-family: 'Inter Tight', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #090B0E;
  }

  /* Raw texture layer — stone/grain */
  .texture {
    position: absolute;
    inset: 0;
    opacity: 0.15;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 6px);
    mix-blend-mode: overlay;
  }

  /* Organic blob — raw, imperfect */
  .blob {
    position: absolute;
    width: 600px;
    height: 600px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 47% 53% 61% 39% / 45% 51% 49% 55%;
    background: radial-gradient(ellipse at 30% 40%, rgba(212,165,116,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(79,140,255,0.08) 0%, transparent 50%);
    filter: blur(40px);
    animation: morph 12s ease-in-out infinite;
  }

  @keyframes morph {
    0%, 100% { border-radius: 47% 53% 61% 39% / 45% 51% 49% 55%; }
    33% { border-radius: 53% 47% 39% 61% / 55% 45% 51% 49%; }
    66% { border-radius: 39% 61% 53% 47% / 49% 55% 45% 51%; }
  }

  /* Grid overlay — tech, precise */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.4;
  }

  /* Content */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
  }

  .brand-name {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #9A9A9F;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #D4A574;
    border: 1px solid rgba(212,165,116,0.3);
    padding: 6px 12px;
  }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }

  .headline {
    font-size: 72px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.03em;
    max-width: 800px;
  }

  .headline em {
    font-style: italic;
    font-weight: 300;
    color: #D4A574;
  }

  .sub {
    font-size: 18px;
    font-weight: 300;
    color: #9A9A9F;
    max-width: 500px;
    line-height: 1.5;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .primitive {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #4A4A4F;
  }

  .primitive span {
    color: #D4A574;
  }

  .cta {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #E8E6E1;
    border-bottom: 1px solid #D4A574;
    padding-bottom: 4px;
  }

  /* Imperfection — raw edge */
  .raw-edge {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #D4A574, transparent);
    opacity: 0.6;
  }

  /* Organic noise dots */
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: radial-gradient(circle, #fff 1px, transparent 1px);
    background-size: 20px 20px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="texture"></div>
  <div class="blob"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="raw-edge"></div>

  <div class="content">
    <div class="top">
      <div class="brand">
        <svg class="brand-mark" viewBox="8 8 48 48" aria-hidden="true"><path fill="#E8E6E1" d="M11 12H30.75V52H26V20H11ZM33.25 12H53V20H38V52H33.25Z"/></svg>
        <span class="brand-name">Twinthos</span>
      </div>
      <span class="tag">Primitive Futurism</span>
    </div>

    <div class="center">
      <h1 class="headline">The raw<br><em>future</em><br>of work.</h1>
      <p class="sub">Before everything became refined and complicated, there was the work itself. We bring that back. One job. One worker. Yours.</p>
    </div>

    <div class="bottom">
      <div class="primitive">PRIMITIVE <span>·</span> FUTURISM <span>·</span> 2026</div>
      <span class="cta">twinthos.com</span>
    </div>
  </div>
</div>
</body>
</html>
