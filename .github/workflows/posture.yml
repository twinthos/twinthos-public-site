name: posture

on:
  workflow_dispatch:
  push:
    branches: [publish]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: ghposture
        uses: twinthos/ghposture@02f71127f72bc4cff739af348a8ba92bca5f406e  # v1.0.0
        with:
          repo: twinthos/twinthos-public-site
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: high
